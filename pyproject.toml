[project]
name = "csa-lab4"
version = "0.1.0"
description = "Lab 4 (CSA): alg language translator and stack processor model"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "coverage>=7.6",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-golden>=0.2.2",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "F",     # pyflakes
    "E",     # pycodestyle
    "W",
    "N",     # pep8-naming
    "I",     # isort
    "C90",   # mccabe
    "UP",    # pyupgrade
    "ERA",   # закомментированный код
    "A",     # затенение builtins
    "B",     # bugbear
    "C4",    # comprehensions
    "COM",   # запятые
    "FA",    # future annotations
    "ICN",
    "INP",   # __init__.py
    "PIE",
    "PT",    # pytest-style
    "Q",
    "RET",
    "S",     # bandit
    "SIM",
    "PTH",   # pathlib
    "PL",    # pylint
    "PERF",
    "TRY",
    "RUF",
]
ignore = [
    "COM812",  # конфликтует с ruff format
    "RUF002",  # комментарии на русском
    "RUF003",
    "PLR2004", # коды символов и разрядности
    "PLR0911", # match по узлам AST
    "TRY003",  # текст ошибки пишется на месте
]

[tool.ruff.lint.per-file-ignores]
"*_test.py" = ["S101"]  # assert в тестах

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
enable_assertion_pass_hook = true
log_format = "%(levelname)-7s %(module)s:%(funcName)-13s %(message)s"

[tool.coverage.run]
branch = true
omit = ["*_test.py"]

[tool.coverage.report]
show_missing = true
