out_ast: |
  let buf[16]
  let head = 0
  let tail = 0
  let numbers[32]
  interrupt on_input()
    set ([] buf (& tail 15)) = (call in 0)
    set tail = (+ tail 1)
  fn read()
    while (== head tail)
    let c = ([] buf (& head 15))
    set head = (+ head 1)
    return c
  fn print_int(n)
    let digits[10]
    if (< n 0)
      expr (call out 1 45)
    else
      set n = (- n)
    let count = 0
    while (|| (== count 0) (!= n 0))
      set ([] digits count) = (- 48 (% n 10))
      set n = (/ n 10)
      set count = (+ count 1)
    while (> count 0)
      set count = (- count 1)
      expr (call out 1 ([] digits count))
  fn sort(a, n)
    let i = 1
    while (< i n)
      let x = ([] a i)
      let j = (- i 1)
      while (&& (>= j 0) (> ([] a j) x))
        set ([] a (+ j 1)) = ([] a j)
        set j = (- j 1)
      set ([] a (+ j 1)) = x
      set i = (+ i 1)
  fn main()
    let n = (call read)
    if (|| (< n 0) (> n 32))
      expr (call print_int -1)
      return
    let i = 0
    while (< i n)
      set ([] numbers i) = (call read)
      set i = (+ i 1)
    expr (call sort numbers n)
    set i = 0
    while (< i n)
      expr (call print_int ([] numbers i))
      expr (call out 1 10)
      set i = (+ i 1)
