out_ast: |
  let buf[16]
  let head = 0
  let tail = 0
  let x[64]
  let y[64]
  interrupt on_input()
    set ([] buf (& tail 15)) = (call in 0)
    set tail = (+ tail 1)
  fn read()
    while (== head tail)
    let c = ([] buf (& head 15))
    set head = (+ head 1)
    return c
  fn print_int(n)
    let digits[10]
    if (< n 0)
      expr (call out 1 45)
    else
      set n = (- n)
    let count = 0
    while (|| (== count 0) (!= n 0))
      set ([] digits count) = (- 48 (% n 10))
      set n = (/ n 10)
      set count = (+ count 1)
    while (> count 0)
      set count = (- count 1)
      expr (call out 1 ([] digits count))
  fn filter(src, dst, n)
    let i = 0
    while (< i n)
      let prev = ([] src i)
      let next = ([] src i)
      if (> i 0)
        set prev = ([] src (- i 1))
      if (< i (- n 1))
        set next = ([] src (+ i 1))
      set ([] dst i) = (/ (+ (+ prev (* 2 ([] src i))) next) 4)
      set i = (+ i 1)
  fn main()
    let n = (call read)
    if (|| (< n 1) (> n 64))
      expr (call print_int -1)
      return
    let i = 0
    while (< i n)
      set ([] x i) = (call read)
      set i = (+ i 1)
    expr (call filter x y n)
    set i = 0
    while (< i n)
      if (> i 0)
        expr (call out 1 32)
      expr (call print_int ([] y i))
      set i = (+ i 1)
