out_ast: |
  let buf[16]
  let head = 0
  let tail = 0
  interrupt on_input()
    set ([] buf (& tail 15)) = (call in 0)
    set tail = (+ tail 1)
  fn read()
    while (== head tail)
    let c = ([] buf (& head 15))
    set head = (+ head 1)
    return c
  fn print_int(n)
    let digits[10]
    if (< n 0)
      expr (call out 1 45)
    else
      set n = (- n)
    let count = 0
    while (|| (== count 0) (!= n 0))
      set ([] digits count) = (- 48 (% n 10))
      set n = (/ n 10)
      set count = (+ count 1)
    while (> count 0)
      set count = (- count 1)
      expr (call out 1 ([] digits count))
  fn is_prime(n)
    if (< n 1)
      return -1
    if (== n 1)
      return 0
    let i = 2
    while (<= i (/ n i))
      if (== (% n i) 0)
        return 0
      set i = (+ i 1)
    return 1
  fn main()
    let n = (call read)
    while (> n 0)
      expr (call print_int (call is_prime (call read)))
      expr (call out 1 10)
      set n = (- n 1)
