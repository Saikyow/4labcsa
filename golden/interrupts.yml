out_ast: |
  let done = 0
  let received = 0
  interrupt on_input()
    let c = (call in 0)
    if (== c 0)
      set done = 1
      return
    if (&& (>= c 97) (<= c 122))
      set c = (+ (- c 97) 65)
    expr (call out 1 c)
    set received = (+ received 1)
  fn print_str(s)
    let i = 1
    while (<= i ([] s 0))
      expr (call out 1 ([] s i))
      set i = (+ i 1)
  fn print_int(n)
    let digits[10]
    if (< n 0)
      expr (call out 1 45)
    else
      set n = (- n)
    let count = 0
    while (|| (== count 0) (!= n 0))
      set ([] digits count) = (- 48 (% n 10))
      set n = (/ n 10)
      set count = (+ count 1)
    while (> count 0)
      set count = (- count 1)
      expr (call out 1 ([] digits count))
  fn main()
    let loops = 0
    while (! done)
      set loops = (+ loops 1)
      if (== (% loops 10) 0)
        expr (call di)
        expr (call print_str '<main>')
        expr (call ei)
    expr (call print_str '\nreceived: ')
    expr (call print_int received)
    expr (call print_str '\nmain loop iterations: ')
    expr (call print_int loops)
