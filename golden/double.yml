out_ast: |
  let buf[16]
  let head = 0
  let tail = 0
  interrupt on_input()
    set ([] buf (& tail 15)) = (call in 0)
    set tail = (+ tail 1)
  fn read()
    while (== head tail)
    let c = ([] buf (& head 15))
    set head = (+ head 1)
    return c
  fn print_str(s)
    let i = 1
    while (<= i ([] s 0))
      expr (call out 1 ([] s i))
      set i = (+ i 1)
  fn copy64(dst, src)
    set ([] dst 0) = ([] src 0)
    set ([] dst 1) = ([] src 1)
  fn add64(dst, a, b)
    let lo = (+ ([] a 1) ([] b 1))
    let carry = (>> (+ (+ (>> ([] a 1) 1) (>> ([] b 1) 1)) (& (& ([] a 1) ([] b 1)) 1)) 31)
    set ([] dst 0) = (+ (+ ([] a 0) ([] b 0)) carry)
    set ([] dst 1) = lo
  fn div10(x)
    let hi = ([] x 0)
    let lo = ([] x 1)
    let cur = (>> hi 16)
    let q = (/ cur 10)
    set cur = (+ (<< (% cur 10) 16) (& hi 65535))
    set ([] x 0) = (+ (<< q 16) (/ cur 10))
    set cur = (+ (<< (% cur 10) 16) (>> lo 16))
    set q = (/ cur 10)
    set cur = (+ (<< (% cur 10) 16) (& lo 65535))
    set ([] x 1) = (+ (<< q 16) (/ cur 10))
    return (% cur 10)
  fn print_u64(x)
    let n[2]
    let digits[20]
    expr (call copy64 n x)
    let count = 0
    while (|| (|| (== count 0) (!= ([] n 0) 0)) (!= ([] n 1) 0))
      set ([] digits count) = (+ 48 (call div10 n))
      set count = (+ count 1)
    while (> count 0)
      set count = (- count 1)
      expr (call out 1 ([] digits count))
  fn fib(dst, k)
    let a[2]
    let b[2]
    let t[2]
    set ([] a 0) = 0
    set ([] a 1) = 0
    set ([] b 0) = 0
    set ([] b 1) = 1
    while (> k 0)
      expr (call add64 t a b)
      expr (call copy64 a b)
      expr (call copy64 b t)
      set k = (- k 1)
    expr (call copy64 dst a)
  fn main()
    let result[2]
    let n = (call read)
    while (> n 0)
      let k = (call read)
      if (|| (< k 0) (> k 93))
        expr (call print_str '-1')
      else
        expr (call fib result k)
        expr (call print_u64 result)
      expr (call out 1 10)
      set n = (- n 1)
